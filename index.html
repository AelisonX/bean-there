<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#273e36"><title>Bean There · Quality Control</title><link rel="stylesheet" href="style.css?v=04"></head><body><main id="game">
<canvas id="scene" width="480" height="800" aria-label="Moving green bean conveyor. Tap rejects or drag to clear a muddy batch."></canvas>
<header><div class="brand"><span>BEAN THERE</span><small>QUALITY CONTROL / ROBOT DIVISION</small></div><div class="utilities"><button id="sound" aria-label="Toggle sound">♪</button><button id="pause" aria-label="Pause shift">Ⅱ</button></div></header>

<footer><span id="streak">CLEAN STREAK · 0</span><span id="toolLabel">TRAINEE GRIPPER</span><span id="belt">BELT 1.0× · +PRESSURE EVERY 10s</span><span id="upgrade">NEW ARM EVERY 20s</span><div class="hint">TAP REJECTS · DRAG TO CLEAR</div></footer>
<section id="overlay" class="overlay"><div id="panel" class="panel"></div></section>
</main><script src="content.js?v=04"></script><script src="engine.js?v=04"></script><script src="game.js?v=04"></script></body></html>
